<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ed Store</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🛍️ ED STORE</h1>
    <p>Tudo o que combina contigo ✨</p>

    <input
      type="text"
      placeholder="🔎 Pesquisar produtos..."
    >
  </header>

  <section class="categorias">
    <h2>Categorias</h2>

    <button>👗 Moda</button>
    <button>💄 Beleza</button>
    <button>👟 Calçados</button>
    <button>👜 Acessórios</button>
  </section>

  <section class="produtos">

    <h2>✨ Produtos em destaque</h2>

    <div class="produto">

      <div class="foto-produto">
        👜
      </div>

      <h3>Bolsa Elegante</h3>

      <p class="preco">15.000 Kz</p>

      <button>❤️</button>
      <button>🛒 Adicionar</button>

    </div>

    <div class="produto">

      <div class="foto-produto">
        👗
      </div>

      <h3>Vestido Elegante</h3>

      <p class="preco">25.000 Kz</p>

      <button>❤️</button>
      <button>🛒 Adicionar</button>

    </div>

    <div class="produto">

      <div class="foto-produto">
        👟
      </div>

      <h3>Ténis Fashion</h3>

      <p class="preco">30.000 Kz</p>

      <button>❤️</button>
      <button>🛒 Adicionar</button>

    </div>

  </section>

  <nav class="menu">

    <button>🏠<br>Início</button>

    <button>🔎<br>Pesquisar</button>

    <button>🛒<br>Carrinho</button>

    <button>👤<br>Perfil</button>

  </nav>

</body>
</html>
